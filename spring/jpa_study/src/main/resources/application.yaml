spring:
  application:
    name: jpa_study
  datasource:
    url: jdbc:mariadb://localhost:3306/study_db
    username: study_user
    password: mariadb
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none           # 우리는 직접 테이블을 만들 거라서 none
      # ddl-auto : none 아무 동작도 안함 (MyBatis xml 쓸때처럼 자동완성 안하겠다)
      # ddl-auto : create 프로젝트 시작 시 테이블 삭제 후 재생성
      # ddl-auto : create-drop 프로젝트 시작 시 테이블 생성, 종료시 삭제
      # 그 외 update, validate 있음
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true       # SQL 보기 좋게 출력
        show_sql: true         # SQL 콘솔 출력
        use_sql_comments: true # 어떤 동작인지 주석으로

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace    # 파라미터 값까지 출력