<!DOCTYPE html>
<!-- html에 타임리프 문법을 적용 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- css, js 파일은 resources/static 폴더 기준으로 검색 -->
    <link rel="stylesheet" href="/css/board_list.css">
</head>
<body>
    게시글 목록 페이지
    <div th:text="${data}"></div>
    <div>[[${ageData}]]</div>
    <p th:text="${data + ageData}"></p>
    <div th:text="${boardList}"></div>


    <div>
        <table class="list-table">
            <thead>
                <tr>
                    <td>글번호</td>
                    <td>제목</td>
                    <td>작성자</td>
                    <td>작성일</td>
                </tr>
            </thead>
            <tbody>
                <!-- 리스트가 비었다면 -->
                <th:block th:if="${#lists.isEmpty(boardList)}">
                    <tr>
                        <td colspan="4">등록된 데이터 없음</td>
                    </tr>
                </th:block>
                <!-- 리스트에 데이터가 있다면 -->
                <th:block th:unless="${#lists.isEmpty(boardList)}">
                    <tr th:each="board : ${boardList}">
                        <td>[[${board.boardNum}]]</td>



                        <td>
                            <a 
                                th:href="@{/boards/detail(boardNum=${board.boardNum})}"
                                th:text="${board.title}" 
                            ></a>
                        </td>
                        
                            
                         
                        <td th:text="${board.writer}"></td>
                        <td>[[${#temporals.format(board.regDate, 'yyyy-MM-dd HH:mm')}]]</td>
                    </tr>
                </th:block>
            </tbody>
        </table>
    </div>
    <div>
        <button 
            type="button"
            onclick="goWrite()"
        >글쓰기</button>
    </div>
    <!-- resources/static 폴더 기준 -->
    <script src="/js/board_list.js"></script>
</body>
</html>
