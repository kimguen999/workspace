<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>배달정보</h2>
  <!-- <div>[[${chicken}]]</div> -->
  <form action="/chickens/show" method="post">
    <div>
      <!-- html은 객체 인식 못하기 때문에 하나하나 적어줘야함 -->
      <input type="hidden" name="chiName" th:value="${chicken.chiName}">
      <input type="hidden" name="chiCnt" th:value="${chicken.chiCnt}">
      <input type="hidden" name="request" th:value="${chicken.request}">
      <!-- 배열이라서 반복문 돌려야함 1번방법 -->
      <th:block th:each="chiAdd : ${chicken.chiAdd}">
        <input type="hidden" name="chiAdd" th:value="${chiAdd}">
      </th:block>
      <!-- 
      2번방법
      <input th:each="chiAdd : ${chicken.chiAdd}" type="hidden" name="chiAdd" th:value="${chiAdd}">
       -->
      
      주문자 <input type="text" name="name"><br>
      연락처 <input type="text" name="tel"><br>
      배달주소 <input type="text" name="add"><br>
      <button type="submit">주문</button>
    </div>
  </form>
</body>
</html>
